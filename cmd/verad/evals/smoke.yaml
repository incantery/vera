# What Vera is claimed to be, written down so a change can break it.
#
# Every case here checks something the code actually promises. The
# system prompt says brief, plain, no markdown; history.go says a
# conversation remembers its own turns and that conversations do not
# leak into each other. Those are assertions, not preferences, and this
# is where they get held to.
#
# A case is one or more turns. The turns of a case share a conversation
# unless the case says otherwise, which is how recall and isolation are
# told apart.
id: vera-smoke
name: Vera smoke
description: The promises the voice prompt and the history window make.
tags: [smoke]

cases:
  - id: plain-question
    name: A plain question is answered briefly
    category: voice
    input:
      turns:
        - say: What is the capital of Austria?
    expected:
      contains: Vienna

  - id: no-markdown-under-pressure
    name: A question that invites a list still answers in prose
    description: >
      The strongest pull toward markdown is a question that sounds like
      it wants bullets. If the voice prompt is ever weakened this is the
      case that notices.
    category: voice
    input:
      turns:
        - say: Give me three things to see in Vienna.

  - id: admits-ignorance
    name: Something unknowable is not invented
    category: voice
    input:
      turns:
        - say: What did I have for breakfast on the fourth of March?

  - id: recall-within-a-conversation
    name: The second turn can refer to the first
    description: The whole reason history exists.
    category: history
    input:
      turns:
        - say: My name is Seth and I am flying to Vienna on Thursday.
        - say: What day am I flying?
    expected:
      contains: Thursday

  - id: recall-survives-a-third-turn
    name: A fact from the first turn survives an unrelated second one
    category: history
    input:
      turns:
        - say: My name is Seth.
        - say: What is the tallest mountain in Austria?
        - say: What is my name?
    expected:
      contains: Seth

  - id: conversations-do-not-leak
    name: A passing detail does not survive into a fresh conversation
    description: >
      The inverse of recall. This case originally used a name — and
      once memory existed it started failing, correctly: a name is
      durable, memory keeps it on purpose, and it SHOULD reach the next
      conversation. What must not carry over is something transient,
      which memory is told to ignore and history is keyed to contain.
      So the detail here is deliberately worth forgetting.
    category: history
    input:
      turns:
        - say: For this puzzle, the number I picked is 4271.
        - say: What number did I pick?
          new_conversation: true
          after_learning: true
    expected:
      absent: "4271"

  - id: memory-crosses-conversations
    name: Something learned in one conversation is known in the next
    description: >
      The claim memory exists to make. The second turn deliberately
      starts a fresh conversation, so history cannot account for it —
      only memory can.
    category: memory
    input:
      turns:
        - say: I am a vegetarian, so no meat for me.
        - say: What should I order at a steakhouse?
          new_conversation: true
          after_learning: true
    expected:
      contains: vegetarian

  - id: memory-corrects-itself
    name: A corrected fact replaces the old one
    description: >
      The failure mode of every memory that only appends: both the old
      belief and the new one survive, and the model arbitrates. A fresh
      conversation should know only the correction.
    category: memory
    input:
      turns:
        - say: I live in Denver.
        - say: I moved to Austin last month.
          after_learning: true
        - say: Where do I live?
          new_conversation: true
          after_learning: true
    expected:
      contains: Austin
      absent: Denver

  - id: delegates-real-work
    name: A task that needs doing gets delegated
    description: >
      The boundary Vera is built on: it does not do the work, it hands
      it to something that can. Only the delegate can have read a file
      it just wrote, so the answer proves the round trip.
    category: tools
    input:
      turns:
        - say: >
            Write a file called eval-marker.txt in your workspace whose
            only contents are the word rhinoceros. Then read it back and
            tell me the word you found.
    expected:
      contains: rhinoceros

  - id: does-not-delegate-what-it-knows
    name: A question it can answer is answered, not delegated
    description: >
      The opposite failure, and the more expensive one: delegating
      trivia spends a minute and real money to produce a sentence the
      model already had.
    category: tools
    input:
      turns:
        - say: What is the capital of Austria? Answer in one word.
    expected:
      contains: Vienna
