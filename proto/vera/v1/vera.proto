// The vera wire, typed: the schema a web page, a phone, and the
// server all agree on. v1 starts at the streaming seam — WatchAgent
// is the realtime feed the polling JSON never was — and grows one
// RPC at a time as surfaces migrate. REST keeps serving what has not
// migrated yet; nothing here is declared before it is served.
syntax = "proto3";

package vera.v1;

option go_package = "github.com/incantery/vera/gen/vera/v1;verav1";

// WatchAgent streams one agent's whole present: a full snapshot
// first, then tail deltas as turns land, tools fire, and spend moves.
message WatchAgentRequest {
  string id = 1;  // the session root, or any id in its lineage
  bool raw = 2;   // direct mode reads raw: no digests computed or billed
}

// One frame. The first (and any frame with reset=true) replaces
// everything; later frames replace history from index `from` and
// carry the rest of the fields whole — they are small.
message WatchAgentResponse {
  Agent agent = 1;
  bool reset = 2;
  int32 from = 3;
  repeated Msg history = 4;
  Ctx ctx = 5;
  Spend spend = 6;
  Pending pending = 7;  // absent: nothing in flight
  repeated Queued queue = 8;
  repeated TreeFile tree = 9;
  string resume = 10;
  int32 artifacts = 11;
}

message Agent {
  string id = 1;
  string title = 2;
  string state = 3;  // "working" | "needs you" | "blocked?" | "idle"
  string dir = 4;
  string branch = 5;
  string tool = 6;
  string tool_detail = 7;
  int32 ctx_pct = 8;
  string age = 9;
}

// Msg is one bubble, the transcript package's Msg on the wire.
message Msg {
  string role = 1;  // "user" | "assistant"
  string text = 2;
  int32 tools = 3;
  repeated Step steps = 4;
  repeated string think = 5;
  int64 ctx = 6;
  string rough = 7;  // membrane provenance on user turns
  Digest digest = 8; // membrane compression, absent in raw watches
  int32 secs = 9;    // how long the assistant turn ran, wall-clock
}

message Step {
  string tool = 1;
  string detail = 2;
  Diff diff = 3;
  string out = 4;   // result excerpt, bounded server-side
  int32 lines = 5;  // total result lines before bounding
  bool err = 6;     // the tool_result carried is_error
}

message Diff {
  string file = 1;
  string old = 2;
  string new = 3;
  bool replace_all = 4;
}

message Digest {
  string state = 1;  // "pending" | "ready" | "failed"
  string headline = 2;
  repeated string bullets = 3;
}

message Ctx {
  int64 tokens = 1;
  int64 fresh_in = 2;
  int64 cache_read = 3;
  int64 cache_write = 4;
  int64 out = 5;
  int64 window = 6;
  string model = 7;
}

message Spend {
  double claude_usd = 1;
  double judge_usd = 2;
}

message Pending {
  string text = 1;
  string sent = 2;    // what the membrane phrased, when it did
  string status = 3;  // "phrasing" | "thinking" | "failed"
  string error = 4;
  bool direct = 5;
  string perm = 6;
  repeated string images = 7;
  int64 at_unix_ms = 8;
}

message Queued {
  string text = 1;
  string perm = 2;
}

message TreeFile {
  string path = 1;
  int32 add = 2;
  int32 del = 3;
  bool is_new = 4;
}

// Say sends one chat message to an agent — the same rail the REST
// endpoint served, typed. The answer is the pending status the watch
// stream will confirm: "phrasing" (the membrane is wording it),
// "thinking" (the turn is running), or "queued" (direct mode typed
// ahead of a busy turn).
message SayRequest {
  string id = 1;
  string text = 2;
  bool verbatim = 3;          // membrane mode: skip the phrasing, send as typed
  bool direct = 4;            // direct mode: no membrane, ever
  string perm = 5;            // "" | "read" | "edit" | "all"
  repeated string images = 6; // paths the upload endpoint answered with
}

message SayResponse {
  string status = 1; // "phrasing" | "thinking" | "queued"
}

// Interrupt kills the in-flight say turn — the TUI's Esc. The
// subprocess dies, the transcript keeps whatever landed, the session
// resumes cleanly on the next send.
message InterruptRequest {
  string id = 1;
}

message InterruptResponse {}

// WatchBoard streams the home screen's whole present: the board's
// columns, the fleet's numbers, the agents rail, the subscription
// budgets. Frames are whole (the payload is small); one arrives
// whenever anything in it changes.
message WatchBoardRequest {}

message WatchBoardResponse {
  repeated BoardTask tasks = 1;
  int32 inflight = 2;    // drives running right now
  double spend = 3;      // everything this process has spent, rolled up
  Fleet fleet = 4;
  repeated Repo repos = 5;
  string notice = 6;
  repeated Session sessions = 7;  // the rail: one row per lineage
  string current = 8;             // the agent with the freshest activity
  Usage usage = 9;                // absent until the collector has answered
}

message Fleet {
  int32 agents = 1;
  int32 working = 2;
}

// Repo is a directory a fresh agent could be born into — a place the
// fleet has already shown, or a scratch workspace vera made.
message Repo {
  string dir = 1;
  string cwd = 2;
  bool scratch = 3;
}

// Session is one rail row: a lineage root wearing its head's live
// state — the same shape the REST rail serves.
message Session {
  string id = 1;
  string title = 2;
  string state = 3;  // "working" | "needs you" | "blocked?" | "idle"
  string dir = 4;
  string cwd = 5;
  string branch = 6;
  string prompt = 7;     // the last thing the human asked, snipped
  string last_text = 8;  // the last thing the assistant said, snipped
  int32 ctx_pct = 9;
  string model = 10;
  string age = 11;
  bool driving = 12;
  string tool = 13;
  string tool_detail = 14;
  string task = 15;  // the open board task assigned to this agent
  bool scratch = 16;
}

// Usage is the subscription's rate-limit windows, from claude's own
// report. Percentages are the truth; resets are prose.
message Usage {
  string mode = 1;
  int32 session_pct = 2;
  string session_resets = 3;
  int32 week_all_pct = 4;
  string week_all_resets = 5;
  string week_model_name = 6;
  int32 week_model_pct = 7;
  string week_model_resets = 8;
}

// BoardTask is one card, whole: the workflow log is the truth about
// the work, the live overlay is the truth about the moment.
message BoardTask {
  string id = 1;
  string title = 2;
  string intent = 3;
  string agent = 4;  // the assignment, "" for backlog
  string goal = 5;
  string goal_actor = 6;
  string col = 7;    // inbox | progress | waiting | done | dropped
  string state = 8;
  string ask = 9;
  string face = 10;
  bool pinned = 11;
  string proposal = 12;
  string proposal_why = 13;
  string proposal_kind = 14;  // "start" | "done"
  double cost_usd = 15;
  repeated TaskRun runs = 16;
  string workspace = 17;
  string scratch_name = 18;
  string mode = 19;  // "" | "read" | "work"
  repeated TaskEvent log = 20;
  repeated Exchange exchanges = 21;
  int64 created_unix_ms = 22;
  int64 updated_unix_ms = 23;
  TaskLive live = 24;  // absent for backlog and closed cards
}

message TaskRun {
  string kind = 1;  // drive | say
  string outcome = 2;
  double cost_usd = 3;
}

message TaskEvent {
  int64 at_unix_ms = 1;
  string actor = 2;  // human | vera | worker (pre-rename events say "rook")
  string text = 3;
}

message Exchange {
  string prompt = 1;
  string reply = 2;
}

message TaskLive {
  string dir = 1;
  string state = 2;
  string now = 3;  // ⛭ tool — detail
}

// The review surface: the whole repo's uncommitted diff, then a
// verdict. Approve commits under the human's own git identity;
// discard puts files back the way HEAD has them.
message ReviewRequest {
  string id = 1;  // the agent whose repo is under review
}

message ReviewFile {
  string path = 1;  // repo-root-relative
  int32 add = 2;
  int32 del = 3;
  bool is_new = 4;      // untracked — HEAD never had it
  bool binary = 5;      // no line diff to show
  bool truncated = 6;   // the diff was bigger than the wire allows
  string diff = 7;      // unified diff text
}

message ReviewResponse {
  string dir = 1;  // the repo root — what approve would commit
  string branch = 2;
  repeated ReviewFile files = 3;
}

message CommitRequest {
  string id = 1;
  string message = 2;  // the human's words; their git identity signs
}

message CommitResponse {
  string commit = 1;  // short hash of the new commit
}

message DiscardRequest {
  string id = 1;
  string path = 2;  // one file, repo-root-relative …
  bool all = 3;     // … or the whole tree back to HEAD
}

message DiscardResponse {}

// Suggest is the vera agent's bid on the human's next move: it reads
// the last finished exchange and answers with a digest of where
// things stand plus one to three ranked replies the human could send.
// Cached per turn server-side — asking twice bills once.
message SuggestRequest {
  string id = 1;
}

message SuggestResponse {
  string happened = 1;         // what the worker just did
  string now = 2;              // where the work stands, what it waits on
  repeated string replies = 3; // ranked, best first, ready to send
}

// Plan is vera's bid on the shape of one piece of work: the owner
// says what they need, vera answers where it should live, its
// cadence, and the goal a worker would be handed. ExecutePlan is the
// owner's nod: make the workspace, open the card, birth the worker.
message PlanRequest {
  string text = 1;  // the owner's ask, in their own words
}

message PlanShape {
  string kind = 1;      // repo | new | none
  string where = 2;     // kind repo: the offered workspace path
  string home = 3;      // kind new: code | life
  string name = 4;      // kind new: the workspace directory name
  string cadence = 5;   // once | standing
  string deadline = 6;  // YYYY-MM-DD, only if the ask named one
  string goal = 7;      // the instruction the worker would be handed
  string why = 8;       // one line the owner reads to judge the plan
}

message PlanResponse {
  string id = 1;  // the bid's id — pass back on execute
  PlanShape plan = 2;
}

message ExecutePlanRequest {
  string id = 1;       // the served bid, if this is one (edits ride the shape)
  PlanShape plan = 2;  // the shape to execute, as approved or amended
  string mode = 3;     // "" (work) | read | work
}

message ExecutePlanResponse {
  string task_id = 1;
  string workspace = 2;
}

service VeraService {
  rpc WatchAgent(WatchAgentRequest) returns (stream WatchAgentResponse);
  rpc Say(SayRequest) returns (SayResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc WatchBoard(WatchBoardRequest) returns (stream WatchBoardResponse);
  rpc Review(ReviewRequest) returns (ReviewResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Discard(DiscardRequest) returns (DiscardResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc Plan(PlanRequest) returns (PlanResponse);
  rpc ExecutePlan(ExecutePlanRequest) returns (ExecutePlanResponse);
}
